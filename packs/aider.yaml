# Aider — AI pair programming in the terminal, on the shared base toolchain.
#
# The base tool ids in `pack.tools` are DEFINED in Rocky Surf's own
# packs/ai-coding-agents.yaml and referenced here. Only `aider` is defined below, which is the
# normal shape for a community pack: bring your own tool, borrow the plumbing.
version: 1

pack:
  packId: aider
  name: Aider
  tools:
    - build-essential
    - curl
    - gh
    - git
    - tmux
    - unzip
    - python3-pip
    - python3-venv
    - pipx
    - aider
  displayOrder: 50
  enabled: true
  # Aider works against a git repository — it reads it, edits it, and commits to it — so a box
  # with none is a box where the tool has nothing to do.
  requiresRepos: true
  requiresRdp: false
  guide: |
    Everything below runs on the box, as `rocky`, after you have SSH'd in.

    Aider
      Aider needs an API key for whichever model you want it to drive. It reads these from
      the environment, so put the one you use in your shell and it will be there next login:

        echo 'export ANTHROPIC_API_KEY=...' >> ~/.bashrc && . ~/.bashrc
        aider --model sonnet

      For OpenAI instead:

        echo 'export OPENAI_API_KEY=...' >> ~/.bashrc && . ~/.bashrc
        aider --model gpt-4o

      Run it from inside a repository. `aider --help` lists the models it knows, and
      https://aider.chat/docs/llms.html covers the rest, including local models via Ollama.

      Aider commits as it goes, on your behalf, by design. `aider --no-auto-commits` if you
      would rather review first, and `git log` to see what it did either way.

    GitHub
      gh auth login           then: gh auth setup-git

      Your shell has no $GITHUB_TOKEN. If the operator set `github.pat` in
      rockysurf.config.yaml, that token was handed to the bootstrap and your repositories
      were cloned with it — but it is not exported into an interactive session, so `gh`
      and your own pushes need this login.

    Also installed
      tmux          run aider in here; a dropped SSH connection then costs you nothing

tools:
  - toolId: aider
    name: Aider
    description: AI pair programming in your terminal, working directly on your git repository
    category: agent
    url: https://aider.chat
    # Band 40, alongside the other agents: after the base toolchain, before any setup step.
    installOrder: 40
    # pipx installs into ~/.local, which belongs to `rocky`. Nothing here needs root, and
    # claiming it would be the rule-4 dishonesty the smoke container is built to catch.
    runAs: rocky
    bootstrap: false
    enabled: true
    installScript: |
      set -euo pipefail
      # pipx puts its binaries here, and this step's shell does not have it on PATH yet.
      export PATH="$HOME/.local/bin:$PATH"
      #
      # PINNED, DELIBERATELY, AND NOT WITH UPSTREAM'S ONE-LINER. Aider's own install page
      # recommends `curl -LsSf https://aider.chat/install.sh | sh`, which is precisely the shape
      # docs/writing-a-pack.md warns about: the thing CI tested is not the thing your users get,
      # and a box built six months from now installs something nobody here has ever run. pipx is
      # already in the base toolchain, takes an explicit version, and resolves the right wheel
      # for the architecture on its own — so there is nothing to branch on and nothing to trust.
      #
      # To bump: change this one line. aider-chat publishes wheels for every release on PyPI.
      aider_version=0.86.2
      #
      # The version is IN the stamp, so bumping it above reinstalls and leaving it alone makes a
      # re-run a genuine no-op — which is the half of rule 1 the run-twice gate measures.
      stamp="$HOME/.rockysurf/installed-aider-$aider_version"
      if [ ! -f "$stamp" ]; then
        # --force so this converges even if a previous attempt died between installing and
        # writing the stamp; without it pipx exits non-zero on an already-installed package.
        pipx install --force "aider-chat==$aider_version"
        mkdir -p "$(dirname "$stamp")" && touch "$stamp"
      fi
      # Guarded, per rule 1: an unguarded append puts the same line in twice on a resumed
      # install, and PATH grows every time the box is rebuilt.
      touch "$HOME/.bashrc"
      grep -qF '.local/bin' "$HOME/.bashrc" || echo 'export PATH="$HOME/.local/bin:$PATH"' >> "$HOME/.bashrc"
      aider --version >/dev/null
