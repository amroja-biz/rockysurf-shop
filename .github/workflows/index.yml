# Regenerate `index.json` on every merge to main.
#
# THIS IS THE ONLY LISTING A CONTROL PLANE READS. Rocky Surf fetches this document and then
# fetches the paths it names, over raw.githubusercontent.com — never the GitHub API, whose
# unauthenticated quota is 60 requests per hour shared across one source IP and would strand any
# installation behind a corporate NAT.
#
# THERE IS NO TRUST LABEL IN IT, deliberately. This registry is community packs only; Rocky
# Surf's official packs ship inside its release and are never mirrored here. A `tier` field would
# therefore be a claim about trustworthiness written by the party being trusted, worth no more
# than the document containing it. An operator's own config says what this registry is to them.
#
# The sha256 in each entry pins a pack file to the entry describing it, so a file swapped without
# a regeneration is refused by the client. It is NOT a signature: whoever can write this file can
# write both halves. That limit is stated in the README rather than papered over.
name: index

on:
  push:
    branches: [main]
    paths:
      - 'packs/**'
      - '.github/workflows/index.yml'
  # So a maintainer can force a regeneration without an empty commit.
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  # Two merges in quick succession would otherwise race to commit the same file and one would
  # lose — leaving an index that describes the registry as it was one merge ago.
  group: index
  cancel-in-progress: false

env:
  NODE_VERSION: '24'
  # What the harness is built from. See .github/actions/pack-harness for why it is built rather
  # than installed, and for the one-line form this becomes once v0.1.0 is on npm.
  UPSTREAM_REF: 'main'

jobs:
  regenerate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          # Push via the index-publisher deploy key: the protect-main ruleset requires
          # PRs from humans, and the deploy key is its one bypass actor. The default
          # workflow token can no longer push to main.
          ssh-key: ${{ secrets.SHOP_INDEX_DEPLOY_KEY }}
      - id: harness
        uses: ./.github/actions/pack-harness
        with:
          ref: ${{ env.UPSTREAM_REF }}
          node-version: ${{ env.NODE_VERSION }}

      # The generator refuses a registry it cannot load, so this doubles as the last check that
      # main is coherent. A broken index is worse than a stale one: every client sees it.
      - name: Generate
        run: node "${{ steps.harness.outputs.bin }}" pack index --source packs --out index.json

      - name: Commit if it changed
        run: |
          set -euo pipefail
          # COMPARE CONTENT, NOT `git diff`, and this is the whole bug that shipped.
          #
          # The first version opened with `git diff --quiet -- index.json` and exited early when
          # it was quiet. It was always quiet on the run that mattered: git diff says nothing
          # about an UNTRACKED file, and index.json did not exist in the repository yet. So the
          # very run that should have created it printed "index.json unchanged" and exited 0.
          # This workflow reported success twice while the registry published nothing, and a
          # merged pack that never reaches the index is invisible to every control plane.
          #
          # So: read what is committed (a marker when there is nothing), read what was just
          # generated, and compare them with `generatedAt` removed — that field moves on every
          # run and would otherwise commit a no-op on every push.
          before=$(git show HEAD:index.json 2>/dev/null | jq -S 'del(.generatedAt)' || echo 'absent')
          after=$(jq -S 'del(.generatedAt)' index.json)
          if [ "$before" = "$after" ]; then
            echo 'index.json unchanged apart from generatedAt — nothing to commit'
            exit 0
          fi
          git config user.name  'rockysurf-shop[bot]'
          git config user.email 'rockysurf-shop@users.noreply.github.com'
          git add index.json
          git commit -m 'index: regenerate from packs/'
          git push
          echo "published $(jq -r '.packs | length' index.json) pack(s) to index.json"

      # The check whose absence let the above ship broken. A workflow that reports success while
      # the thing it exists to publish is missing is worse than one that fails: nothing
      # downstream can tell the difference, and the registry just looks empty.
      #
      # It runs on every push, not only when something changed, because "the index is present and
      # describes the packs" is a claim worth re-checking even on a no-op run.
      - name: The index is actually published
        run: |
          set -euo pipefail
          committed=$(git show HEAD:index.json 2>/dev/null || true)
          if [ -z "$committed" ]; then
            echo '::error::index.json is not committed on this branch, so the registry publishes nothing.'
            exit 1
          fi
          listed=$(printf '%s' "$committed" | jq '.packs | length')
          present=$(find packs -name '*.yaml' -o -name '*.yml' | wc -l | tr -d ' ')
          echo "index.json lists $listed pack(s); packs/ holds $present file(s)"
          if [ "$listed" != "$present" ]; then
            echo "::error::the published index describes $listed pack(s) but packs/ holds $present"
            exit 1
          fi
