# Every pull request, gated by the same checks Rocky Surf gates its own packs with.
#
# WHY THE HARNESS COMES FROM UPSTREAM AND NOT A VENDORED SCRIPT. The four author rules and the
# smoke harness live in the `rockysurf` CLI (amroja-biz/rockysurf, rockysurf-arym.2). Copying them
# here would produce a gate that agrees with the contract on the day it is copied and drifts
# afterwards — and it would drift in the worst direction, accepting packs the control plane
# rejects.
#
# WHY IT IS BUILT RATHER THAN INSTALLED. `rockysurf` is not on npm yet; the publish is gated
# behind v0.1.0. So `.github/actions/pack-harness` builds it from a shallow clone. That is the
# PRE-RELEASE FORM and it has an expiry date — when v0.1.0 publishes it becomes one `npx` line,
# tracked as `rockysurf-arym.7`. It is a composite action so that swap is one file.
#
# Nothing needs `--base-packs`: a built harness carries the packs its own release ships
# (`rockysurf-io02`), so the shared base toolchain a community pack references — `curl`, `git`,
# `nodejs` and the rest — resolves out of the binary. Nothing from the clone is committed here,
# which is what keeps "no mirror" true.
#
# WHAT THIS DOES NOT DO. It does not decide whether a pack is safe. An installScript is arbitrary
# root-privileged shell; lint proves the file is well-formed and check proves it survives a
# resume. A maintainer reading the diff is the control that covers the rest.
name: pack checks

on:
  pull_request:
    paths:
      - 'packs/**'
      - '.github/workflows/pack-pr.yml'

permissions:
  contents: read

env:
  NODE_VERSION: '24'
  # What the harness is built from. A release tag would be better once one exists; until then the
  # checks track what Rocky Surf currently ships, which is what an operator will have.
  UPSTREAM_REF: 'main'

jobs:
  # Which packs a pull request actually touched. Running the whole catalog on every PR would take
  # an hour and tell the contributor nothing about their own file.
  discover:
    runs-on: ubuntu-24.04
    outputs:
      packs: ${{ steps.changed.outputs.packs }}
      any: ${{ steps.changed.outputs.any }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The merge base has to be reachable for the diff below to mean anything.
          fetch-depth: 0

      - id: changed
        name: Pack ids added or modified by this pull request
        run: |
          set -euo pipefail
          # Deleted files are excluded (--diff-filter=d): a pack that is going away cannot be
          # smoke-tested, and trying to is a confusing red tick on a tidy-up PR.
          mapfile -t files < <(
            git diff --name-only --diff-filter=d \
              "origin/${{ github.base_ref }}...HEAD" -- 'packs/*.yaml' 'packs/*.yml'
          )
          ids=()
          for f in "${files[@]:-}"; do
            [ -n "$f" ] || continue
            id=$(basename "$f"); id=${id%.*}
            ids+=("$id")
          done
          if [ ${#ids[@]} -eq 0 ]; then
            echo 'any=false' >> "$GITHUB_OUTPUT"
            echo 'packs=[]'  >> "$GITHUB_OUTPUT"
            echo 'No pack files changed.'
          else
            # `-Rn` with `[inputs]` and NOT `jq -Rrc . | jq -sc .`. The pair looks equivalent and
            # is not: `-r` makes the first jq print its result RAW, so the second one is handed a
            # bare `aider` rather than a quoted `"aider"` and dies with "Invalid numeric literal".
            # The step still exits 0 — the failure is inside a command substitution — so `packs`
            # was written empty, `fromJSON` got nothing to expand, and the check job was silently
            # never created while every visible job stayed green.
            packs=$(printf '%s\n' "${ids[@]}" | jq -Rnc '[inputs]')
            # Belt and braces, because the failure above was invisible precisely for want of it:
            # an empty or malformed value here must stop the run, not skip the matrix.
            case "$packs" in
              '['*']') ;;
              *) echo "::error::discover produced no usable pack list: '$packs'"; exit 1 ;;
            esac
            echo "any=true" >> "$GITHUB_OUTPUT"
            echo "packs=$packs" >> "$GITHUB_OUTPUT"
            printf 'Changed: %s -> %s\n' "${ids[*]}" "$packs"
          fi

  # THERE IS NO LONGER A CLOSED-PATHS JOB, and its removal is deliberate rather than an
  # oversight, so it is recorded here instead.
  #
  # It refused any pull request that touched `index.json`, on the reasoning that the file is
  # generated on merge and a hand-edited one describes packs it no longer matches. That rule and
  # the "committed index matches the packs" check below cannot both hold: one forbids a
  # contributor from carrying their index update, the other requires it.
  #
  # The drift check is strictly the better of the two. `closed-paths` refused the legitimate case
  # (an index that matches) and the illegitimate one (an index that does not) alike, because a
  # path-based rule cannot tell them apart. Comparing content can, and does. What it protects is
  # the same thing, arrived at by looking rather than by prohibiting.

  # The whole registry, statically. Cheap enough to run every time, and it is the check that
  # catches the failures affecting OTHER packs — a duplicate toolId, a dangling reference — which
  # a per-pack check by construction cannot see.
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - id: harness
        uses: ./.github/actions/pack-harness
        with:
          ref: ${{ env.UPSTREAM_REF }}
          node-version: ${{ env.NODE_VERSION }}

      # `--allow-empty` because this registry is legitimately empty until its first contribution
      # merges, and a repository whose CI is red on the day it is created teaches everyone to
      # ignore the tick. The flag is not the default: for a pack author running the command by
      # hand, an empty result means a mistyped path.
      - name: Lint every pack
        run: node "${{ steps.harness.outputs.bin }}" pack lint packs --allow-empty

      # THE PULL REQUEST CARRIES ITS OWN INDEX UPDATE, rather than leaving main stale between
      # workflow runs. Regenerating here also proves the registry can be indexed at all — a
      # duplicate packId across files is invisible to the lint above and fatal on merge.
      #
      # `generatedAt` is removed before comparing, because it moves on every run and is not part
      # of what a contributor is being asked to keep in step.
      - name: The committed index matches the packs
        run: |
          set -euo pipefail
          node "${{ steps.harness.outputs.bin }}" pack index --source packs --out /tmp/index.expected.json

          # An index that does not exist yet is a different message from one that is stale, and a
          # contributor who gets "run this command" rather than "your file is wrong" fixes it in
          # one step. The empty-registry case reaches here too: `pack index` on an empty packs/
          # emits a valid document with zero packs, so there is always something to compare —
          # which is why this needs no --allow-empty of its own, unlike the lint above.
          if [ ! -f index.json ]; then
            echo '::error::index.json is missing. Run: npx rockysurf pack index --source packs --out index.json'
            exit 1
          fi

          if ! diff -u <(jq -S 'del(.generatedAt)' index.json) <(jq -S 'del(.generatedAt)' /tmp/index.expected.json); then
            echo ''
            echo '::error::index.json does not match packs/. Regenerate and commit it:'
            echo '::error::  npx rockysurf pack index --source packs --out index.json'
            exit 1
          fi
          echo "index.json matches packs/ ($(jq '.packs | length' index.json) pack(s))"

  check:
    needs: discover
    if: needs.discover.outputs.any == 'true'
    runs-on: ${{ matrix.runner }}
    # Generous on purpose. The heaviest packs install a compiler, a browser stack and a desktop
    # environment, twice. A timeout that fires spuriously teaches people to re-run a job without
    # reading it.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        pack: ${{ fromJSON(needs.discover.outputs.packs) }}
        arch: [amd64, arm64]
        # Native runners on both sides. GitHub's arm64 Linux runners are free for public
        # repositories, and native is worth arranging: the same work under QEMU emulation runs
        # roughly an order of magnitude slower, which for a pack that installs a compiler is the
        # difference between minutes and hitting the timeout above.
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - id: harness
        uses: ./.github/actions/pack-harness
        with:
          ref: ${{ env.UPSTREAM_REF }}
          node-version: ${{ env.NODE_VERSION }}

      - name: Two runs, one container, resume journal discarded between them
        run: |
          node "${{ steps.harness.outputs.bin }}" pack check \
            packs \
            --pack ${{ matrix.pack }} \
            --arch ${{ matrix.arch }}
